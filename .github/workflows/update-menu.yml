name: Uppdatera matsedel

on:
  workflow_dispatch:
  schedule:
    # 04:15 UTC = 06:15 svensk sommartid / 05:15 svensk vintertid.
    - cron: "15 4 * * *"

permissions:
  contents: write

jobs:
  update-menu:
    runs-on: ubuntu-latest
    steps:
      - name: Hämta repository
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Hämta aktuell meny från Matilda
        run: python matsedel/fetch-menu.py

      - name: Spara ändrad meny
        run: |
          if git diff --quiet matsedel/menu.json; then
            echo "Ingen ändring i matsedeln."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add matsedel/menu.json
          git commit -m "Uppdatera veckans matsedel"
          git push
