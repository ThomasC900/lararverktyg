name: Uppdatera matsedel

on:
  workflow_dispatch:
  schedule:
    # Två försök på måndagsmorgonen.
    # 02:17 UTC = 04:17 svensk sommartid / 03:17 vintertid
    - cron: "17 2 * * 1"
    # Reservkörning
    - cron: "17 4 * * 1"

permissions:
  contents: write

jobs:
  update-menu:
    runs-on: ubuntu-latest

    steps:
      - name: Hämta repository
        uses: actions/checkout@v7

      - name: Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Hämta aktuell meny från Ölyckeskolan i Matilda
        run: python matsedel/fetch-menu.py

      - name: Visa skapad meny
        run: |
          echo "----- menu.json -----"
          cat matsedel/menu.json

      - name: Spara ändrad meny
        run: |
          if git diff --quiet matsedel/menu.json; then
            echo "Ingen ändring i matsedeln."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add matsedel/menu.json
          git commit -m "Uppdatera veckans matsedel"
          git push
