name: Uppdatera matsedel

on:
  workflow_dispatch:
  schedule:
    # Två försök varje måndag före skoldagens start.
    # 02:17 UTC = 04:17 svensk sommartid / 03:17 svensk vintertid.
    - cron: "17 2 * * 1"
    # 04:17 UTC = 06:17 svensk sommartid / 05:17 svensk vintertid.
    - cron: "17 4 * * 1"

permissions:
  contents: write

jobs:
  update-menu:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Hämta repository
        uses: actions/checkout@v7

      - name: Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Hämta aktuell meny från Ölyckeskolan i Matilda
        run: python matsedel/fetch-menu.py

      - name: Visa vilken vecka som hämtades
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("matsedel/menu.json").read_text(encoding="utf-8"))
          print(f"Vecka: {data.get('week')}")
          print(f"Period: {data.get('period')}")
          print(f"Uppdaterad: {data.get('updated')}")
          print(f"Källa: {data.get('source')}")
          PY

      - name: Spara ändrad meny
        run: |
          if git diff --quiet matsedel/menu.json; then
            echo "Ingen ändring i matsedeln."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add matsedel/menu.json
          git commit -m "Uppdatera veckans matsedel"
          git push
