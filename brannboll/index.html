<main class="match" aria-label="Poängräknare för två lag"></main>
<dialog id="resetDialog"><h2>Starta ny match?</h2><p>Poängen och historiken nollställs för båda lagen. Lagnamnen behålls.</p><div class="actions"><button class="cancel" id="cancel">Avbryt</button><button class="reset" id="confirm">Nollställ</button></div></dialog>
<script>
'use strict';
const key='thomas-brannboll-v1';
const events=[['Helvarv',5],['Lyra',3],['Bränd',1],['Inlöpning',1],['Utebränt lag',10]];
let state={names:['Lag 1','Lag 2'],history:[[],[]]};
try{const saved=JSON.parse(localStorage.getItem(key));if(saved&&Array.isArray(saved.names)&&saved.names.length===2&&saved.names.every(n=>typeof n==='string')&&Array.isArray(saved.history)&&saved.history.length===2&&saved.history.every(h=>Array.isArray(h)&&h.every(e=>Number.isInteger(e)&&e>=0&&e<events.length)))state=saved;}catch{}
function save(){try{localStorage.setItem(key,JSON.stringify(state));}catch{}}
const main=document.querySelector('main');
for(let t=0;t<2;t++){
 const section=document.createElement('section');section.className='team'+(t?' gold':'');section.setAttribute('aria-label','Lag '+(t+1));
 section.innerHTML='<input class="name" maxlength="40" aria-label="Lagnamn för lag '+(t+1)+'" placeholder="Lag '+(t+1)+'"><output class="total" aria-label="Totalpoäng" aria-live="polite">0</output><div class="caption">Totalpoäng</div><div class="buttons"></div><div class="foot"><span class="last"></span><button class="undo">↶ Ångra</button></div>';
 const name=section.querySelector('input');name.value=state.names[t];name.addEventListener('input',()=>{state.names[t]=name.value;save()});name.addEventListener('focus',()=>name.select());
 for(let e=0;e<events.length;e++){const [label,points]=events[e];const b=document.createElement('button');b.className='score';b.innerHTML='<b>+'+points+'</b><span>'+label+'</span>';b.setAttribute('aria-label',label+', '+points+' poäng till lag '+(t+1));b.addEventListener('click',()=>{state.history[t].push(e);save();render(t)});section.querySelector('.buttons').append(b)}
 section.querySelector('.undo').addEventListener('click',()=>{state.history[t].pop();save();render(t)});main.append(section);
}
function render(t){const s=main.children[t],h=state.history[t];s.querySelector('output').textContent=h.reduce((sum,e)=>sum+events[e][1],0);s.querySelector('.undo').disabled=!h.length;s.querySelector('.last').textContent=h.length?'Senast: '+events[h[h.length-1]][0]+' +'+events[h[h.length-1]][1]:'Tryck på lagnamnet för att ändra';}
render(0);render(1);
const dialog=document.querySelector('dialog');document.querySelector('#new').onclick=()=>dialog.showModal();document.querySelector('#cancel').onclick=()=>dialog.close();document.querySelector('#confirm').onclick=()=>{state.history=[[],[]];save();render(0);render(1);dialog.close()};
</script></body></html>
